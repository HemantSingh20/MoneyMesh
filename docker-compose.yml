version: '3.8'

services:
  mongodb:
    image: mongo:6.0-alpine
    container_name: moneymesh-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - moneymesh-network

  backend:
    build: ./backend
    container_name: moneymesh-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/moneymesh
      - JWT_SECRET=moneymesh_super_secure_jwt_secret_token_key_2026
      - NODE_ENV=development
    depends_on:
      - mongodb
    networks:
      - moneymesh-network

  frontend:
    build: ./frontend
    container_name: moneymesh-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - moneymesh-network

volumes:
  mongodb_data:

networks:
  moneymesh-network:
    driver: bridge
